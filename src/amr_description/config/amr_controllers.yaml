# Controllers for the AMR in Gazebo Harmonic via gz_ros2_control.
controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    # Caster swivel joints are fixed now, so only the wheels are listed.
    joints:
      - drive_left_wheel_joint
      - drive_right_wheel_joint
      - front_left_caster_wheel_joint
      - front_right_caster_wheel_joint
      - rear_left_caster_wheel_joint
      - rear_right_caster_wheel_joint

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["drive_left_wheel_joint"]
    right_wheel_names: ["drive_right_wheel_joint"]
    wheel_separation: 0.384
    wheel_radius: 0.075
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]
    open_loop: false
    enable_odom_tf: false
    cmd_vel_timeout: 0.5
    use_stamped_vel: true
    linear.x.max_velocity: 0.6
    linear.x.min_velocity: -0.6
    linear.x.max_acceleration: 1.0
    angular.z.max_velocity: 1.5
    angular.z.max_acceleration: 3.0
